worker_processes 1;

error_log C:/laragon/tmp/log-traffic-topology-error.log notice;
pid C:/laragon/tmp/log-traffic-topology-nginx.pid;

events {
    worker_connections 512;
}

http {
    include C:/laragon/bin/nginx/nginx-1.28.2/conf/mime.types;
    default_type application/octet-stream;
    sendfile on;
    client_max_body_size 520m;

    server {
        listen 127.0.0.1:8080;
        server_name localhost 127.0.0.1;
        root "C:/Users/Alvis Syahril/log-traffic-analytics/public";
        index index.php;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            try_files $uri =404;
            include C:/laragon/bin/nginx/nginx-1.28.2/conf/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $document_root;
            fastcgi_pass 127.0.0.1:9074;
            fastcgi_read_timeout 300;
        }

        location ~* \.(?:css|js|svg|png|jpe?g|gif|webp|woff2?)$ {
            try_files $uri =404;
            expires 1h;
            add_header Cache-Control "public, max-age=3600";
        }

        location ~ /\. {
            deny all;
        }
    }
}
